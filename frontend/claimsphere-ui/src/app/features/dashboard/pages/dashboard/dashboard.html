<div class="dashboard">

  <div class="hero">

    <div>

      <h1>Welcome Back 👋</h1>

      <p>

        Manage all your insurance claims from one place.

      </p>

    </div>

    <button class="create-btn" (click)="createClaim()">

      + Create Claim

    </button>

  </div>

  <div class="stats">

    <app-stat-card title="Total Claims" [value]="totalClaims" icon="description" color="#2563eb" trend="+8%">
    </app-stat-card>

    <app-stat-card title="Open Claims" [value]="openClaims" icon="check_circle" color="#22c55e" trend="+15%">
    </app-stat-card>

    <app-stat-card title="Closed Claims" [value]="closedClaims" icon="task_alt" color="#ef4444" trend="+6%">
    </app-stat-card>

    <app-stat-card title="Pending Claims" [value]="pendingClaims" icon="schedule" color="#f59e0b" trend="-3%">
    </app-stat-card>

  </div>
  <div class="dashboard-content">

    <app-recent-claims [claims]="claims"></app-recent-claims>

    <app-quick-actions></app-quick-actions>

</div>

</div>
