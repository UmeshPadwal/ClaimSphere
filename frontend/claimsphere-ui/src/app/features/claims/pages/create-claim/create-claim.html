<div class="claim-container">

  <div class="claim-card">

    <h2>{{ isEditMode ? 'Update Claim' : 'Create Claim' }}</h2>

    <form
      [formGroup]="claimForm"
      (ngSubmit)="onSubmit()">

      <div class="form-grid">

        <!-- Claim Number -->
        <div class="form-group">
          <label>Claim Number</label>
          <input
            type="text"
            formControlName="claimNumber"
            placeholder="Enter Claim Number">
        </div>

        <!-- Policy Number -->
        <div class="form-group">
          <label>Policy Number</label>
          <input
            type="text"
            formControlName="policyNumber"
            placeholder="Enter Policy Number">
        </div>

        <!-- Customer Name -->
        <div class="form-group">
          <label>Customer Name</label>
          <input
            type="text"
            formControlName="customerName"
            placeholder="Enter Customer Name">
        </div>

        <!-- Claim Type -->
        <div class="form-group">
          <label>Claim Type</label>

          <select formControlName="claimType">

            <option value="">Select Claim Type</option>

            @for(type of claimTypes; track type){

              <option [value]="type">
                {{ type }}
              </option>

            }

          </select>
        </div>

        <!-- City -->
        <div class="form-group">
          <label>City</label>

          <select formControlName="city">

            <option value="">Select City</option>

            @for(city of cities; track city){

              <option [value]="city">
                {{ city }}
              </option>

            }

          </select>
        </div>

        <!-- Status -->
        <div class="form-group">
          <label>Status</label>

          <select formControlName="status">

            @for(status of statuses; track status){

              <option [value]="status">
                {{ status }}
              </option>

            }

          </select>
        </div>

        <!-- Amount -->
        <div class="form-group">
          <label>Amount</label>
          <input
            type="number"
            formControlName="amount"
            placeholder="Enter Claim Amount">
        </div>

        <!-- Incident Date -->
        <div class="form-group">
          <label>Incident Date</label>
          <input
            type="date"
            formControlName="incidentDate">
        </div>

        <!-- Reported Date -->
        <div class="form-group full-width">
          <label>Reported Date</label>
          <input
            type="date"
            formControlName="reportedDate">
        </div>

      </div>

      <div class="button-group">

        <button
          type="button"
          class="cancel-btn"
          (click)="cancel()">

          Cancel

        </button>

        <button type="submit">

          {{ isEditMode ? 'Update Claim' : 'Save Claim' }}

        </button>

      </div>

    </form>

  </div>

</div>
