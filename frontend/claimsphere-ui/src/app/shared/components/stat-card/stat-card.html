<div class="stat-card">

  <div class="card-header">

    <div class="icon-box" [style.background]="color()">
      <mat-icon>{{ icon() }}</mat-icon>
    </div>

    <span class="trend">
      {{ trend() }}
    </span>

  </div>

  <div class="card-body">

    <div class="title">
      {{ title() }}
    </div>

    <div class="value">
      {{ value() }}
    </div>

    <div class="subtitle">
      {{ subtitle() }}
    </div>

  </div>

</div>
